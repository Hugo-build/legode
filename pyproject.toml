[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "legode"
version = "0.1.0"
description = "Composable building blocks for implicit ordinary differential equations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]
examples = [
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legode = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["legode"]
